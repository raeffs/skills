deviations: |
  `description` says "the project's tracker" where upstream says "the configured
  tracker", following from the tracker detection below. No "Use when…" trigger
  clause: the skill sets `disable-model-invocation: true`, so its description is
  never matched for triggering.
  Upstream's `/setup-matt-pocock-skills` config dependency is replaced by an
  inline "Determine the issue tracker" section detecting the tracker from the
  git remote: Forgejo/Codeberg → `fgj`, Azure DevOps → `quill`, GitHub → `gh`,
  Redmine → `redmine-cli` (native `blocks` relations, `--parent` for sub-issues).
  Step 5 names the detected tooling rather than "the configured tracker" and the
  `/setup-matt-pocock-skills` config, and adds the `Ready for Agent` status
  fallback for label-less trackers.
  Upstream's agents/openai.yaml (Codex metadata) is deliberately not adopted.
