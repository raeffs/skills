deviations: |
  Questions are asked one at a time, not in rounds. Upstream asks the whole
  frontier per round; here one frontier question is picked per turn, numbered
  in sequence across the session, and the user answers before the next. The
  question format, "yes accepts the recommendation", and the subagent
  fact-finding are upstream's.
  Upstream's agents/openai.yaml (Codex metadata) is deliberately not adopted.
